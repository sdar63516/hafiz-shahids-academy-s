<script>
window.HSA_API_BASE = window.HSA_API_BASE || 'https://hafiz-shahids-academy.onrender.com';
/* HSA APP V4 — REAL BACKEND ADAPTER
   Set window.HSA_API_BASE before this script for a separately hosted app.
   Same-origin deployments can leave it blank.
*/
const API_BASE=(window.HSA_API_BASE||localStorage.getItem('hsa_api_base')||'').replace(/\/$/,'');
const STUDENT_TOKEN_KEY='hsa_student_token', ADMIN_TOKEN_KEY='hsa_admin_token';
let role=localStorage.getItem('hsa_role')||'', studentToken=localStorage.getItem(STUDENT_TOKEN_KEY)||'', adminToken=localStorage.getItem(ADMIN_TOKEN_KEY)||'', current=null, DB={settings:{},courses:[],posts:[],announcements:[],materials:[],assignments:[],submissions:[],liveClasses:[],certificates:[],users:[],payments:[],applications:[],notifications:[],receipts:[],doubts:[]}, page=localStorage.getItem('hsa_app_page')||(role==='admin'?'admin':'home');
const esc=v=>String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
const api=(path)=>API_BASE+path;
function asset(url){if(!url)return ''; if(/^https?:\/\//i.test(url)||/^data:/i.test(url)||url.startsWith('blob:'))return url; return API_BASE+(url.startsWith('/')?url:'/'.concat(url));}
async function request(path,opts={}){
  const headers=new Headers(opts.headers||{});
  headers.set('Accept','application/json');
  if(!(opts.body instanceof FormData)&&opts.body!==undefined)headers.set('Content-Type','application/json');
  if(studentToken)headers.set('x-student-token',studentToken);
  if(adminToken)headers.set('x-admin-token',adminToken);
  let r;
  try{
    r=await fetch(api(path),{...opts,headers,cache:'no-store',mode:'cors'});
  }catch(err){
    const msg=String(err?.message||err||'Network error');
    throw Error(`Cannot connect to academy server. Please check your internet connection and make sure the Academy backend is online. (${msg})`);
  }
  let j={};
  try{j=await r.json()}catch{j={error:await r.text()}}
  if(!r.ok){
    if(r.status===401&&(path.startsWith('/api/student-state')||path.startsWith('/api/certificates'))){studentToken='';localStorage.removeItem(STUDENT_TOKEN_KEY);role='';current=null;}
    if(r.status===401&&path.startsWith('/api/admin')){adminToken='';localStorage.removeItem(ADMIN_TOKEN_KEY);role='';}
    throw Error(j.error||`Request failed (${r.status})`)
  }
  return j
}
async function loadPublic(){const j=await request('/api/public-state');DB.settings=j.settings||{};DB.courses=j.courses||[];DB.posts=j.posts||[];DB.announcements=j.announcements||[];}

const studentNav=[['home','⌂','Dashboard'],['purchased','▣','Purchased Courses'],['courses','◈','All Courses'],['classes','▶','Classes'],['assignments','✓','Assignments'],['materials','▤','Study Material'],['certificates','★','Certificates'],['doubts','?','My Doubts'],['profile','●','Profile']];

function studentHome(m){const name=current?.name||'Student';const enrolled=(current?.enrollments||[]).filter(e=>e.active!==false);m.innerHTML=`<section class="hero"><div><div class="eyebrow">WELCOME BACK</div><h1><span class="gradient-text">${esc(name)}</span></h1><p>Your academy, courses, classes and progress — connected to the live academy server.</p><div class="actions" style="margin-top:18px"><button class="btn white-btn" onclick="go('courses')">Explore Courses</button><button class="btn glass-btn" onclick="go('classes')">My Classes</button><button class="btn glass-btn" onclick="go('purchased')">Purchased Courses</button></div></div><div class="hero-orb">✦</div></section><div class="stats"><div class="stat"><div class="num gradient-text">${DB.courses.length}</div><small>Available Courses</small></div><div class="stat"><div class="num gradient-text">${enrolled.length}</div><small>My Courses</small></div><div class="stat"><div class="num gradient-text">${DB.assignments.length}</div><small>Assignments</small></div><div class="stat"><div class="num gradient-text">${DB.certificates.length}</div><small>Certificates</small></div></div><div class="section-head"><div><h2>Featured Courses</h2><p>Published directly from the academy.</p></div><span class="link" onclick="go('courses')">See all</span></div><div class="grid">${DB.courses.slice(0,3).map(courseCard).join('')||'<div class="empty">No courses published yet.</div>'}</div><div class="section-head"><div><h2 class="gradient-text">Latest Posts</h2><p>Tap a poster to open the complete post.</p></div><div class="slider-controls"><button onclick="slidePosts(-1)">‹</button><button onclick="slidePosts(1)">›</button></div></div><div id="postSlider" class="post-slider">${DB.posts.map(postCard).join('')||'<div class="empty">No posts yet.</div>'}</div>`}

function openPurchasedCourse(id){

function studentAssignments(m){m.innerHTML=`<div class="section-head"><div><div class="eyebrow">PRACTICE</div><h2 class="gradient-text" style="font-size:30px">Assignments</h2></div></div><div class="list">${DB.assignments.map(a=>{const sub=DB.submissions.find(s=>s.assignmentId===a.id);return `<div class="listrow"><div class="left"><div class="thumb assignment-thumb">✓</div><div class="meta"><b>${esc(a.title)}</b><small>${esc(courseName(a.courseId))} · Due ${esc(a.dueDate||'Not specified')} · ${a.points||10} points</small></div></div><div class="actions"><span class="badge ${sub?'green':'orange'}">${sub?esc(sub.status):'Pending'}</span>${!sub?`<button class="btn primary" onclick="submitAssignment('${a.id}')">Submit</button>`:''}</div></div>`}).join('')||'<div class="empty">No assignments yet.</div>'}</div>`}

function renderAdmin(m){if(page==='admin')return adminDashboard(m);if(page==='adminCourses')return adminCourses(m);if(page==='adminPosts')return adminPosts(m);if(page==='adminClasses')return adminClasses(m);if(page==='adminAssignments')return adminAssignments(m);if(page==='adminMaterials')return adminMaterials(m);if(page==='adminStudents')return adminStudents(m);return adminPurchases(m)}
function adminToolbar(title,sub,button,fn){return `<div class="section-head"><div><div class="eyebrow">ADMIN CONTROL</div><h2 class="gradient-text" style="font-size:27px">${title}</h2><p>${sub}</p></div>${button?`<button class="btn primary gradient-btn" onclick="${fn}">${button}</button>`:''}</div>`}
function adminDashboard(m){const pending=(DB.payments||[]).filter(x=>x.status==='Pending').length;m.innerHTML=`<section class="hero admin-hero"><div><div class="eyebrow">LIVE ADMIN CONTROL CENTER</div><h1><span class="gradient-text-light">Academy Overview</span></h1><p>Manage the same live courses, posts, classes, students, materials and payments used by the academy website.</p></div><div class="hero-orb">⚡</div></section><div class="stats"><div class="stat"><div class="num gradient-text">${DB.users?.filter(u=>u.role==='student'&&u.status!=='deleted').length||0}</div><small>Students</small></div><div class="stat"><div class="num gradient-text">${DB.courses?.length||0}</div><small>Courses</small></div><div class="stat"><div class="num gradient-text">${DB.posts?.length||0}</div><small>Posts</small></div><div class="stat"><div class="num gradient-text">${pending}</div><small>Pending Payments</small></div></div><div class="grid4"><button class="quick-card" onclick="go('adminCourses')">▣<b>Courses</b><span>Add • Edit • Delete</span></button><button class="quick-card" onclick="go('adminPosts')">✦<b>Posts</b><span>Poster • Text • Slider</span></button><button class="quick-card" onclick="go('adminClasses')">▶<b>Classes</b><span>YouTube • Upload • Zoom</span></button><button class="quick-card" onclick="go('adminStudents')">●<b>Students</b><span>Accounts • Passwords</span></button></div>`}
function adminCourses(m){m.innerHTML=adminToolbar('Courses','Manage live academy courses and covers.','＋ Add Course','courseForm()')+`<div class="grid">${DB.courses.map(c=>courseCard(c,true)).join('')||'<div class="empty">No courses yet.</div>'}</div>`}
function courseForm(id){const c=id?DB.courses.find(x=>String(x.id)===String(id)):{title:'',category:'General',price:0,oldPrice:0,description:'',level:'All Levels',duration:'30 days',validity:'30 days',startDate:'',syllabusUrl:''};openModal(id?'Edit Course':'Add Course',`<div class="formgrid"><div class="field full"><label>Course Title</label><input id="f_title" value="${esc(c.title)}"></div><div class="field"><label>Category</label><input id="f_category" value="${esc(c.category||'General')}"></div><div class="field"><label>Price</label><input id="f_price" type="number" value="${Number(c.price||0)}"></div><div class="field"><label>Old Price</label><input id="f_old" type="number" value="${Number(c.oldPrice||0)}"></div><div class="field"><label>Level</label><input id="f_level" value="${esc(c.level||'All Levels')}"></div><div class="field"><label>Duration</label><input id="f_duration" value="${esc(c.duration||'30 days')}"></div><div class="field"><label>Validity</label><input id="f_validity" value="${esc(c.validity||c.duration||'30 days')}"></div><div class="field"><label>Start Date</label><input id="f_start" value="${esc(c.startDate||'')}"></div><div class="field full"><label>Description</label><textarea id="f_desc">${esc(c.description||'')}</textarea></div><div class="field full"><label>Course Cover</label><input id="f_cover" type="file" accept="image/*"><small>Website backend saves the cover permanently.</small></div><div class="field full"><label>Syllabus URL (optional)</label><input id="f_syllabus" value="${esc(c.syllabusUrl||'')}"></div></div><button class="btn primary gradient-btn wide" onclick="saveCourse('${id||''}')">Save Course</button>`,null)}
async function saveCourse(id){const fd=new FormData();[['title','f_title'],['category','f_category'],['price','f_price'],['oldPrice','f_old'],['level','f_level'],['duration','f_duration'],['validity','f_validity'],['startDate','f_start'],['description','f_desc'],['syllabusUrl','f_syllabus']].forEach(([a,b])=>fd.append(a,document.getElementById(b).value));const f=document.getElementById('f_cover').files[0];if(f)fd.append('cover',f);try{await request(id?`/api/admin/course/${id}/edit`:'/api/admin/course',{method:'POST',body:fd});closeModal();await loadAdmin();renderApp();toast(id?'Course updated':'Course added')}catch(e){toast(e.message)}}
async function delCourse(id){if(!confirm('Delete this course from the academy?'))return;try{await request(`/api/admin/course/${id}/delete`,{method:'POST'});await loadAdmin();renderApp();toast('Course deleted')}catch(e){toast(e.message)}}
function adminPosts(m){m.innerHTML=adminToolbar('Posts','Upload poster images and publish openable posts.','＋ Add Post','postForm()')+`<div class="post-admin-grid">${DB.posts.map(p=>`<article class="card"><div class="post-img">${p.image?`<img src="${asset(p.image)}">`:''}</div><div class="body"><h3 class="gradient-heading">${esc(p.title)}</h3><p>${esc(p.text)}</p><div class="actions"><button class="btn blue" onclick="postForm('${p.id}')">Edit</button><button class="btn red" onclick="delPost('${p.id}')">Delete</button></div></div></article>`).join('')||'<div class="empty">No posts yet.</div>'}</div>`}
function postForm(id){const p=id?DB.posts.find(x=>String(x.id)===String(id)):{title:'',text:'',image:''};openModal(id?'Edit Post':'Add Post',`<div class="field"><label>Post Title</label><input id="f_title" value="${esc(p.title)}"></div><div class="field"><label>Post Text</label><textarea id="f_text">${esc(p.text||'')}</textarea></div><div class="field"><label>Poster Image</label><input id="f_image" type="file" accept="image/*"><small>JPG/PNG/WebP up to 6 MB.</small></div><button class="btn primary gradient-btn wide" onclick="savePost('${id||''}')">Publish Post</button>`,null)}
async function savePost(id){const fd=new FormData();fd.append('title',document.getElementById('f_title').value.trim());fd.append('text',document.getElementById('f_text').value);const f=document.getElementById('f_image').files[0];if(f)fd.append('imageFile',f);try{await request(id?`/api/admin/post/${id}/edit`:'/api/admin/post',{method:'POST',body:fd});closeModal();await loadAdmin();renderApp();toast(id?'Post updated':'Post published')}catch(e){toast(e.message)}}
async function delPost(id){if(!confirm('Delete this post permanently?'))return;try{await request(`/api/admin/post/${id}/delete`,{method:'POST'});await loadAdmin();renderApp();toast('Post deleted')}catch(e){toast(e.message)}}
function adminClasses(m){const lessons=DB.courses.flatMap(c=>(c.lessons||[]).map(l=>({...l,courseTitle:c.title})));m.innerHTML=adminToolbar('Classes','Manage recorded YouTube/upload lessons and Zoom classes.','＋ Add Recorded','lessonForm()')+`<div class="section-head"><h2>Recorded Classes / Lessons</h2></div><div class="list">${lessons.map(l=>`<div class="listrow"><div class="left"><div class="thumb">▶</div><div class="meta"><b>${esc(l.title)}</b><small>${esc(l.courseTitle)} · ${esc(l.type||'')}</small></div></div><div class="actions"><button class="btn blue" onclick="lessonForm('${l.id}')">Edit</button><button class="btn red" onclick="delLesson('${l.id}')">Delete</button></div></div>`).join('')||'<div class="empty">No recorded lessons.</div>'}</div><div class="section-head"><h2>Live / Zoom</h2><button class="btn primary gradient-btn" onclick="liveForm()">＋ Schedule Live</button></div><div class="list">${DB.liveClasses.map(l=>`<div class="listrow"><div class="left"><div class="thumb live-thumb">LIVE</div><div class="meta"><b>${esc(l.title)}</b><small>${esc(courseName(l.courseId))} · ${esc(l.date||'')} · ${esc(l.time||'')}</small></div></div><div class="actions"><button class="btn blue" onclick="liveForm('${l.id}')">Edit</button><button class="btn red" onclick="delLive('${l.id}')">Delete</button></div></div>`).join('')||'<div class="empty">No live classes.</div>'}</div>`}
function lessonForm(id){let found;for(const c of DB.courses){const l=(c.lessons||[]).find(x=>String(x.id)===String(id));if(l)found={c,l}}const l=found?.l||{title:'',type:'youtube',video:'',description:'',free:false};openModal(id?'Edit Lesson':'Add Recorded Lesson',`<div class="formgrid"><div class="field full"><label>Course</label><select id="f_course">${DB.courses.map(c=>`<option value="${esc(c.id)}" ${found?.c.id===c.id?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div><div class="field full"><label>Lesson Title</label><input id="f_title" value="${esc(l.title)}"></div><div class="field"><label>Type</label><select id="f_type"><option value="youtube" ${l.type==='youtube'?'selected':''}>YouTube Link</option><option value="upload" ${l.type==='upload'?'selected':''}>Upload Video</option></select></div><div class="field"><label>YouTube / Video URL</label><input id="f_video" value="${esc(l.video||'')}" placeholder="https://youtube.com/..."></div><div class="field full"><label>Upload Video (optional)</label><input id="f_file" type="file" accept="video/*"><small>For very large videos, the website's existing Cloudinary flow remains the preferred upload path.</small></div><div class="field full"><label>Description</label><textarea id="f_desc">${esc(l.description||'')}</textarea></div></div><button class="btn primary gradient-btn wide" onclick="saveLesson('${id||''}')">Save Lesson</button>`,null)}
async function saveLesson(id){const fd=new FormData();[['courseId','f_course'],['title','f_title'],['type','f_type'],['video','f_video'],['description','f_desc']].forEach(([a,b])=>fd.append(a,document.getElementById(b).value));const f=document.getElementById('f_file').files[0];if(f)fd.append('file',f);try{await request(id?`/api/admin/lesson/${id}/edit`:'/api/admin/lesson',{method:'POST',body:fd});closeModal();await loadAdmin();renderApp();toast(id?'Lesson updated':'Lesson added')}catch(e){toast(e.message)}}
async function delLesson(id){if(!confirm('Delete this lesson?'))return;try{await request(`/api/admin/lesson/${id}/delete`,{method:'POST'});await loadAdmin();renderApp();toast('Lesson deleted')}catch(e){toast(e.message)}}
function liveForm(id){const l=id?DB.liveClasses.find(x=>String(x.id)===String(id)):{courseId:DB.courses[0]?.id||'',title:'',date:'',time:'',zoom:'',recording:'',status:'Upcoming'};openModal(id?'Edit Live Class':'Schedule Live Class',`<div class="formgrid"><div class="field full"><label>Course</label><select id="f_course">${DB.courses.map(c=>`<option value="${esc(c.id)}" ${String(l.courseId)===String(c.id)?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div><div class="field full"><label>Class Title</label><input id="f_title" value="${esc(l.title||'')}"></div><div class="field"><label>Date</label><input id="f_date" type="date" value="${esc(l.date||'')}"></div><div class="field"><label>Time</label><input id="f_time" type="time" value="${esc(l.time||'')}"></div><div class="field full"><label>Zoom / Meeting Link</label><input id="f_zoom" value="${esc(l.zoom||'')}" placeholder="https://zoom.us/j/..."></div><div class="field full"><label>Recording URL (optional)</label><input id="f_recording" value="${esc(l.recording||'')}"></div></div><button class="btn primary gradient-btn wide" onclick="saveLive('${id||''}')">Save Live Class</button>`,null)}
async function saveLive(id){const body={courseId:document.getElementById('f_course').value,title:document.getElementById('f_title').value,date:document.getElementById('f_date').value,time:document.getElementById('f_time').value,zoom:document.getElementById('f_zoom').value,recording:document.getElementById('f_recording').value};try{await request(id?`/api/admin/live/${id}/edit`:'/api/admin/live',{method:'POST',body:JSON.stringify(body)});closeModal();await loadAdmin();renderApp();toast(id?'Live class updated':'Live class scheduled')}catch(e){toast(e.message)}}
async function delLive(id){if(!confirm('Delete this live class?'))return;try{await request(`/api/admin/live/${id}/delete`,{method:'POST'});await loadAdmin();renderApp();toast('Live class deleted')}catch(e){toast(e.message)}}
function adminAssignments(m){m.innerHTML=adminToolbar('Assignments','Create, edit and delete assignments.','＋ Add Assignment','assignmentForm()')+`<div class="list">${DB.assignments.map(a=>`<div class="listrow"><div class="left"><div class="thumb assignment-thumb">✓</div><div class="meta"><b>${esc(a.title)}</b><small>${esc(courseName(a.courseId))} · Due ${esc(a.dueDate||'')}</small></div></div><div class="actions"><button class="btn blue" onclick="assignmentForm('${a.id}')">Edit</button><button class="btn red" onclick="delAssignment('${a.id}')">Delete</button></div></div>`).join('')||'<div class="empty">No assignments.</div>'}</div>`}
function assignmentForm(id){const a=id?DB.assignments.find(x=>String(x.id)===String(id)):{courseId:DB.courses[0]?.id||'',title:'',description:'',dueDate:'',points:10};openModal(id?'Edit Assignment':'Add Assignment',`<div class="field"><label>Course</label><select id="f_course">${DB.courses.map(c=>`<option value="${esc(c.id)}" ${String(a.courseId)===String(c.id)?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div><div class="field"><label>Title</label><input id="f_title" value="${esc(a.title)}"></div><div class="field"><label>Description</label><textarea id="f_desc">${esc(a.description||'')}</textarea></div><div class="formgrid"><div class="field"><label>Due Date</label><input id="f_due" type="date" value="${esc(a.dueDate||'')}"></div><div class="field"><label>Points</label><input id="f_points" type="number" value="${Number(a.points||10)}"></div></div><button class="btn primary gradient-btn wide" onclick="saveAssignment('${id||''}')">Save Assignment</button>`,null)}
async function saveAssignment(id){const body={courseId:document.getElementById('f_course').value,title:document.getElementById('f_title').value,description:document.getElementById('f_desc').value,dueDate:document.getElementById('f_due').value,points:Number(document.getElementById('f_points').value||10)};try{await request(id?`/api/admin/assignment/${id}/edit`:'/api/admin/assignment',{method:'POST',body:JSON.stringify(body)});closeModal();await loadAdmin();renderApp();toast(id?'Assignment updated':'Assignment added')}catch(e){toast(e.message)}}
async function delAssignment(id){if(!confirm('Delete this assignment?'))return;try{await request(`/api/admin/assignment/${id}/delete`,{method:'POST'});await loadAdmin();renderApp();toast('Assignment deleted')}catch(e){toast(e.message)}}
function adminMaterials(m){m.innerHTML=adminToolbar('Study Material','Upload, replace or delete course files.','＋ Add Material','materialForm()')+`<div class="list">${DB.materials.map(x=>`<div class="listrow"><div class="left"><div class="thumb material-thumb">FILE</div><div class="meta"><b>${esc(x.title)}</b><small>${esc(courseName(x.courseId))} · ${esc(x.originalName||'')}</small></div></div><div class="actions"><button class="btn blue" onclick="materialForm('${x.id}')">Edit</button><button class="btn red" onclick="delMaterial('${x.id}')">Delete</button></div></div>`).join('')||'<div class="empty">No study material.</div>'}</div>`}
function materialForm(id){const x=id?DB.materials.find(a=>String(a.id)===String(id)):{courseId:DB.courses[0]?.id||'',title:''};openModal(id?'Edit Material':'Add Material',`<div class="field"><label>Course</label><select id="f_course">${DB.courses.map(c=>`<option value="${esc(c.id)}" ${String(x.courseId)===String(c.id)?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div><div class="field"><label>Title</label><input id="f_title" value="${esc(x.title)}"></div><div class="field"><label>File</label><input id="f_file" type="file"></div><button class="btn primary gradient-btn wide" onclick="saveMaterial('${id||''}')">Save Material</button>`,null)}
async function saveMaterial(id){const fd=new FormData();fd.append('courseId',document.getElementById('f_course').value);fd.append('title',document.getElementById('f_title').value);const f=document.getElementById('f_file').files[0];if(f)fd.append('file',f);try{await request(id?`/api/admin/material/${id}/edit`:'/api/admin/material',{method:'POST',body:fd});closeModal();await loadAdmin();renderApp();toast(id?'Material updated':'Material added')}catch(e){toast(e.message)}}
async function delMaterial(id){if(!confirm('Delete this material?'))return;try{await request(`/api/admin/material/${id}/delete`,{method:'POST'});await loadAdmin();renderApp();toast('Material deleted')}catch(e){toast(e.message)}}
function adminStudents(m){const students=(DB.users||[]).filter(u=>u.role==='student'&&u.status!=='deleted');m.innerHTML=adminToolbar('Students','Manage student accounts and passwords.','＋ Add Student','studentForm()')+`<div class="list">${students.map(x=>`<div class="listrow"><div class="left"><div class="thumb student-thumb">${esc((x.name||'S').charAt(0))}</div><div class="meta"><b>${esc(x.name)} <span style="color:#667085">(${esc(x.id)})</span></b><small>${esc(x.email||'No email')} · ${esc(x.phone||'No phone')}</small></div></div><div class="actions"><button class="btn blue" onclick="studentForm('${x.id}')">Edit</button><button class="btn gold" onclick="resetStudentPassword('${x.id}')">Password</button><button class="btn red" onclick="delStudent('${x.id}')">Delete</button></div></div>`).join('')||'<div class="empty">No students.</div>'}</div>`}
function studentForm(id){const x=id?DB.users.find(u=>String(u.id)===String(id)):{name:'',email:'',phone:'',country:'+91',password:''};openModal(id?'Edit Student':'Add Student',`<div class="formgrid"><div class="field full"><label>Full Name</label><input id="f_name" value="${esc(x.name||'')}"></div><div class="field"><label>Email</label><input id="f_email" type="email" value="${esc(x.email||'')}"></div><div class="field"><label>Phone</label><input id="f_phone" value="${esc(x.phone||'').replace(/^\+91/,'')}"></div><div class="field"><label>Country Code</label><input id="f_country" value="${esc(x.country||'+91')}"></div>${!id?`<div class="field full"><label>Initial Password</label><input id="f_password" type="password" placeholder="Minimum 8 characters"></div>`:''}</div><button class="btn primary gradient-btn wide" onclick="saveStudent('${id||''}')">Save Student</button>`,null)}
async function saveStudent(id){const body={name:document.getElementById('f_name').value,email:document.getElementById('f_email').value,phone:document.getElementById('f_phone').value,country:document.getElementById('f_country').value};if(!id)body.password=document.getElementById('f_password').value;try{const j=await request('/api/admin/student',{method:'POST',body:JSON.stringify(body)});if(id&&body.name!==DB.users.find(u=>u.id===id)?.name)toast('Website backend identifies students by name; account fields were updated where supported.');closeModal();await loadAdmin();renderApp();toast(j.existing?'Student account updated':'Student created')}catch(e){toast(e.message)}}
async function resetStudentPassword(id){const p=prompt('New password (minimum 8 characters):');if(!p)return;if(p.length<8)return toast('Password must be at least 8 characters.');try{await request(`/api/admin/student/${id}/password`,{method:'POST',body:JSON.stringify({password:p})});toast('Password updated')}catch(e){toast(e.message)}}
async function delStudent(id){if(!confirm('Delete this student account?'))return;try{await request(`/api/admin/student/${id}/delete`,{method:'POST'});await loadAdmin();renderApp();toast('Student deleted')}catch(e){toast(e.message)}}
function adminPurchases(m){const ps=DB.payments||[];m.innerHTML=adminToolbar('Payments','Review purchase submissions and activate/reject course access.','Refresh Payments','refreshData()')+`<div class="list">${ps.map(x=>`<div class="listrow payment-row"><div class="left"><div class="thumb payment-thumb">₹</div><div class="meta"><b>${esc(x.courseTitle||courseName(x.courseId))}</b><small>${esc(x.studentName||'')} · ${esc(x.studentId||'')} · ₹${Number(x.amount||0).toLocaleString('en-IN')} · ${esc(x.utr||'No UTR')}</small></div></div><div class="actions"><span class="badge ${x.status==='Approved'?'green':x.status==='Rejected'?'red':'orange'}">${esc(x.status)}</span>${x.status==='Pending'?`<button class="btn green" onclick="approvePayment('${x.id}')">Approve</button><button class="btn red" onclick="rejectPayment('${x.id}')">Reject</button>`:''}${x.screenshot?`<button class="btn blue" onclick="openImage('${esc(x.screenshot)}')">Screenshot</button>`:''}</div></div>`).join('')||'<div class="empty">No payments found.</div>'}</div>`}
function openImage(src){openModal('Payment Screenshot',`<img class="full-image" src="${asset(src)}">`,null)}
async function approvePayment(id){if(!confirm('Approve this payment and activate the course?'))return;try{await request(`/api/admin/payment/${id}/approve`,{method:'POST'});await loadAdmin();renderApp();toast('Payment approved and course access activated.')}catch(e){toast(e.message)}}
async function rejectPayment(id){if(!confirm('Reject this payment?'))return;try{await request(`/api/admin/payment/${id}/reject`,{method:'POST'});await loadAdmin();renderApp();toast('Payment rejected.')}catch(e){toast(e.message)}}
async function submitAssignment(id){const answer=prompt('Enter your assignment answer:');if(answer===null)return;const fd=new FormData();fd.append('assignmentId',id);fd.append('answer',answer);try{await request('/api/assignment/submit',{method:'POST',body:fd});await loadStudent();renderApp();toast('Assignment submitted.')}catch(e){toast(e.message)}}
async function checkBackend(){const dot=document.getElementById('syncdot'),txt=document.getElementById('syncText');if(!dot||!txt)return;try{const r=await fetch(api('/api/health'),{cache:'no-store'});if(!r.ok)throw 0;dot.classList.remove('off');txt.textContent='Online • live academy backend';}catch{dot.classList.add('off');txt.textContent='Offline • backend not reachable';}}
async function forceUpdate(){toast('Checking for latest app and academy data…');try{if('serviceWorker' in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.update()}await refreshData()}catch(e){toast(e.message)}}
function openModal(title,html,save){const b=document.getElementById('modalback');if(!b)return;b.classList.add('open');document.getElementById('modal').innerHTML=`<div class="modalhead"><h3 class="gradient-heading">${esc(title)}</h3><button class="close" onclick="closeModal()">×</button></div>${html}`;document.getElementById('modal')._save=save||null}
function closeModal(){const b=document.getElementById('modalback');if(b)b.classList.remove('open')}
function toast(msg){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),2800)}
document.getElementById('modalback')?.addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
boot();
</script>
</body>
</html>
